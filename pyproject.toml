[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "x5-loyalty-poc"
version = "0.1.0"
description = "Recipe-first X5 Domovoi hackathon proof of concept"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
]
# Only used by the offline recsys/calibration/fit_from_kaggle.py script,
# which is not on any runtime/test import path — the core recsys package
# (profiles/recipes/inventory/model/evaluation/simulation/economics) has no
# dependency beyond `dev` above.
ml = [
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
]
# Only used by recsys/catboost_model.py (experiment 1's CatBoost challenger,
# see docs/research/recsys/experiment-1-ranker-quality-report.md). That
# module falls back to scikit-learn's GradientBoostingClassifier (the `ml`
# extra above) when catboost is not installed, so nothing on the runtime or
# test import path hard-requires it.
experiment1 = [
  "catboost>=1.2,<2",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*", "recsys*"]

[tool.setuptools.package-data]
recsys = ["data/*.json"]
